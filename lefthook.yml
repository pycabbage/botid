pre-commit:
  commands:
    lint:
      glob: "*.go"
      # Whole module, not {staged_files}: files from different packages fail to type-check when passed individually.
      run: golangci-lint run ./...
    format:
      glob: "*.go"
      # --diff only prints and exits non-zero; it never rewrites files.
      run: golangci-lint fmt --diff

pre-push:
  commands:
    vet:
      run: go vet ./...
    test:
      run: go test ./...
